# Real-package corpus manifest: pinned, independently authored pure-R
# packages from CRAN, vendored under tests/real-packages/vendor/.
# Each entry records the exact version, source hash, license, why it was
# chosen (the engine axis it exercises), and its current status.
#
# Status values:
#   pass    — installs and its probe expressions match the oracle
#   partial — installs and loads; a documented subset of probes pass
#   blocked — cannot load yet; the blocker names the exact missing feature
#
# This is NOT "N supported packages": it is evidence with a denominator.
# The synthetic feature matrix (SYNTHETIC_PACKAGE_FEATURE_MATRIX in
# crates/r-embed/tests/embed.rs) remains the systematic loader suite;
# this corpus shows real-ecosystem compatibility per package.

[[package]]
name = "whisker"
version = "0.4.1"
tarball = "vendor/whisker_0.4.1.tar.gz"
sha256 = "bf5151494508032f68ac41e211bda80da9087c65c7068ffdd12f16669bf1f2bc"
cran_md5 = "eda4d778ea813e892c86511d355ee26c"
license = "GPL-3"
needs_compilation = false
axis = "templating engine: nested subscripts, newline-continuation, multiline formals, first-class environments"
status = "partial"
probes = [
  "whisker.render(\"Hello {{name}}!\", list(name=\"World\")) == \"Hello World!\"",
  "whisker.render(\"{{#show}}yes{{/show}}\", list(show=TRUE)) == \"yes\"",
]
blocker = "mapply() with named FUN argument hangs the evaluator (renderTemplate path); positional-FUN mapply works"

