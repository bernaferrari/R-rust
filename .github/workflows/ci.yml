name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy (workspace, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (workspace)
        run: cargo test --workspace

  conformance:
    name: Conformance parity vs stock R
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Stock R conformance (three-way parity)
        run: PATH="$HOME/.local/bin:$(Rscript -e 'cat(dirname(Rscript <- Sys.which("Rscript")))' 2>/dev/null):$PATH" bash scripts/conformance_parity.sh --check

      - name: Script-level differential
        run: PATH="$(dirname $(Rscript -e 'cat(Sys.which("Rscript"))')):$PATH" bash scripts/script_diff_parity.sh --check

  wasm:
    name: WASM32 toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: WASM toolchain check
        run: bash scripts/wasm_toolchain_check.sh
