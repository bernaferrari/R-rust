name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Clippy (embedding crates, deny warnings)
        run: cargo clippy -p r-embed -p r-uniffi -- -D warnings

      - name: Test rmath
        run: env RUSTFLAGS="-Awarnings" cargo test -p rmath -- --test-threads=1

      - name: Test embedding APIs
        run: env RUSTFLAGS="-Awarnings" cargo test -p r-embed -p r-uniffi -- --test-threads=1

      - name: Set up R
        if: runner.os == 'Linux'
        uses: r-lib/actions/setup-r@v2

      - name: Script-level differential tests
        if: runner.os == 'Linux'
        run: bash scripts/script_diff_parity.sh --check

      - name: Stock R conformance (strict)
        if: runner.os == 'Linux'
        run: bash scripts/conformance_parity.sh --check --strict

      - name: Safe API audit
        run: bash scripts/audit_safe_api.sh

  miri:
    name: Miri (memory safety)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: miri-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            miri-cargo-

      - name: Miri smoke tests
        run: |
          cargo miri test -p rmath \
            sexp::memory::tests::test_arena_alloc_node \
            sexp::gengc::tests::test_full_gc_preserves_protected_old_objects \
            -- --test-threads=1
