name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Explicit checkpoints get their own group and retain their event commit.
  # Push/PR runs retain the existing one-running/one-pending branch policy.
  group: ci-${{ github.event_name == 'workflow_dispatch' && format('checkpoint-{0}', github.run_id) || github.ref }}
  cancel-in-progress: false

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Ensure rustfmt component
        run: rustup component add rustfmt || true
      - uses: Swatinem/rust-cache@v2

      - name: rustfmt (workspace)
        run: cargo fmt --check --all

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Ensure clippy component
        run: rustup component add clippy || true
      - uses: Swatinem/rust-cache@v2

      - name: Clippy (workspace, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check optional GPU embedding API
        run: cargo clippy -p r-embed --features vello-gpu --all-targets -- -D warnings

      - name: Install system BLAS/LAPACK
        run: sudo apt-get update && sudo apt-get install -y liblapack-dev libblas-dev

      - name: Test linked system BLAS/LAPACK adapter contracts
        run: >-
          cargo test -p rmath --no-default-features
          --features fortran-backend --lib modules::lapack::backend_tests

      - name: Check system BLAS/LAPACK embedding profile
        run: cargo check -p r-embed --no-default-features --features fortran-backend

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check capability inventory
        run: python3 scripts/capability_report.py --check

      - name: Test parity deadlines and log capture
        run: |
          bash scripts/conformance_artifacts_test.sh
          python3 -m unittest scripts/tests/test_run_parity_case.py scripts/tests/test_conformance_deadline_report.py scripts/tests/test_conformance_runner_output.py scripts/tests/test_conformance_shards.py scripts/tests/test_upstream_execution.py scripts/tests/test_optimize_wasm_runtime.py

      - name: Test (workspace)
        run: cargo test --workspace

      - name: Check generated UniFFI bindings
        run: scripts/generate_uniffi_bindings.sh --check

  package-integration:
    name: Public package integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Record immutable package execution profile
        env:
          RPORT_PACKAGE_REPORT: ${{ runner.temp }}/public-package-checkpoint
        run: |
          mkdir -p "$RPORT_PACKAGE_REPORT"
          python3 - <<'PY'
          import json, os, pathlib, shutil, subprocess
          profile = {
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "build_profile": "debug",
              "features": ["r-embed/default", "rmath/rust-backend", "rmath/renderplot-device"],
              "numerical_backend": "faer",
              "device": "owned renderplot scene",
              "package_policies": ["native/default", "portable/explicit-empty"],
              "host_rscript": shutil.which("Rscript"),
              "r_home": os.environ.get("R_HOME"),
              "timeout_seconds": 1200,
              "scope": "Selected public package tests; separate from complete workspace and conformance results",
          }
          (pathlib.Path(os.environ["RPORT_PACKAGE_REPORT"]) / "profile.json").write_text(json.dumps(profile, indent=2) + "\n")
          PY

      - name: Execute original public package workflows
        run: >-
          python3 scripts/upstream_execution.py process
          --directory "${{ runner.temp }}/public-package-checkpoint/execute"
          --cwd "$PWD" --timeout 1200 --separate-streams --
          scripts/cargo_dev.sh test -p r-embed
          --test embed --test namespace_initialization
          --test portable_namespace_integration --test portable_grdevices_namespace
          --test portable_stats_namespace --test complex_print_contract
          --test get_lazy_mode --test correlation_public_contract --test palette_public_contract

      - name: Upload durable public package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-package-checkpoint
          path: ${{ runner.temp }}/public-package-checkpoint
          if-no-files-found: error

  conformance:
    name: Exact R conformance shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      RPORT_CONFORMANCE_PROFILE: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Validate immutable R oracle manifest
        id: oracle
        run: |
          python3 scripts/validate_r_oracle.py --github-output "$GITHUB_OUTPUT"
          python3 -m unittest scripts/tests/test_validate_r_oracle.py
          python3 -m unittest scripts/tests/test_validate_upstream_r_tests.py

      - name: Cache exact R oracle build
        uses: actions/cache@v4
        with:
          path: ${{ steps.oracle.outputs.cache_dir }}
          key: ${{ runner.os }}-r-oracle-${{ steps.oracle.outputs.manifest_sha256 }}

      - name: Install exact R oracle build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libbz2-dev libcurl4-openssl-dev libicu-dev liblzma-dev libpcre2-dev libreadline-dev libzstd-dev

      - name: Build or restore exact R oracle
        run: |
          bash scripts/install_r_oracle.sh
          echo "${{ steps.oracle.outputs.cache_dir }}/bin" >> "$GITHUB_PATH"

      - name: Exact-oracle conformance parity
        env:
          RPORT_REQUIRE_PINNED_ORACLE: "1"
        run: >-
          bash scripts/conformance_parity.sh --check --strict
          --shard-index "${{ matrix.shard }}" --shard-count 6
          --report "${{ runner.temp }}/conformance-report"

      - name: Upload exact-oracle conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-oracle-conformance-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/conformance-report
          if-no-files-found: ignore


  conformance-coverage:
    name: Complete exact-oracle conformance coverage
    needs: conformance
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download every shard report
        uses: actions/download-artifact@v4
        with:
          pattern: exact-oracle-conformance-shard-*
          path: target/conformance-shards
      - name: Require complete immutable inventory and strict parity
        if: always()
        run: >-
          python3 scripts/conformance_shards.py
          --input-dir target/conformance-shards --shard-count 6
          --source-commit "${{ github.sha }}"
          --json target/conformance-union/summary.json
          --markdown target/conformance-union/summary.md
      - name: Upload full coverage result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-oracle-conformance-union
          path: target/conformance-union
          if-no-files-found: error

  integration-parity:
    name: Whole-script differential parity
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      RPORT_CONFORMANCE_PROFILE: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Validate immutable R oracle manifest
        id: oracle
        run: |
          python3 scripts/validate_r_oracle.py --github-output "$GITHUB_OUTPUT"
          python3 -m unittest scripts/tests/test_validate_r_oracle.py
          python3 -m unittest scripts/tests/test_validate_upstream_r_tests.py

      - name: Cache exact R oracle build
        uses: actions/cache@v4
        with:
          path: ${{ steps.oracle.outputs.cache_dir }}
          key: ${{ runner.os }}-r-oracle-${{ steps.oracle.outputs.manifest_sha256 }}

      - name: Install exact R oracle build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libbz2-dev libcurl4-openssl-dev libicu-dev liblzma-dev libpcre2-dev libreadline-dev libzstd-dev

      - name: Build or restore exact R oracle
        run: |
          bash scripts/install_r_oracle.sh
          echo "${{ steps.oracle.outputs.cache_dir }}/bin" >> "$GITHUB_PATH"

      - name: Whole-script differential parity
        env:
          RPORT_REQUIRE_PINNED_ORACLE: "1"
        run: bash scripts/script_diff_parity.sh --check

  upstream-parity:
    name: Pinned upstream ${{ matrix.suite }} shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {suite: curated, shard: 0, count: 1}
          - {suite: whole, shard: 0, count: 4}
          - {suite: whole, shard: 1, count: 4}
          - {suite: whole, shard: 2, count: 4}
          - {suite: whole, shard: 3, count: 4}
    runs-on: ubuntu-24.04
    # A shard can contain multiple 1800s workloads; allow their receipts to finish.
    timeout-minutes: 90
    env:
      RPORT_CONFORMANCE_PROFILE: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Validate immutable R oracle manifest
        id: oracle
        run: |
          python3 scripts/validate_r_oracle.py --github-output "$GITHUB_OUTPUT"
          python3 -m unittest scripts/tests/test_validate_r_oracle.py
          python3 -m unittest scripts/tests/test_validate_upstream_r_tests.py

      - name: Cache exact R oracle build
        uses: actions/cache@v4
        with:
          path: ${{ steps.oracle.outputs.cache_dir }}
          key: ${{ runner.os }}-r-oracle-${{ steps.oracle.outputs.manifest_sha256 }}

      - name: Install exact R oracle build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libbz2-dev libcurl4-openssl-dev libicu-dev liblzma-dev libpcre2-dev libreadline-dev libzstd-dev locales
          sudo localedef -i en_US -f ISO-8859-1 en_US.ISO8859-1

      - name: Build or restore exact R oracle
        run: |
          bash scripts/install_r_oracle.sh
          echo "${{ steps.oracle.outputs.cache_dir }}/bin" >> "$GITHUB_PATH"

      - name: Bounded unchanged pinned upstream execution
        env:
          RPORT_REQUIRE_PINNED_ORACLE: "1"
        run: >-
          bash scripts/upstream_core_slices.sh --strict --timeout 1800
          --runtime-profile graphics --package-policy native
          --suite "${{ matrix.suite }}" --shard-index "${{ matrix.shard }}"
          --shard-count "${{ matrix.count }}" --report "${{ runner.temp }}/upstream-r"
      - name: Upload durable upstream execution and engine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-r-shard-${{ matrix.suite }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/upstream-r
          if-no-files-found: ignore

  upstream-coverage:
    name: Complete pinned upstream15+70 inventory and strict parity
    needs: upstream-parity
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download every completed or partial upstream report
        uses: actions/download-artifact@v4
        with:
          pattern: upstream-r-shard-*
          path: target/upstream-shards
      - name: Authenticate exact original inventory union and strict comparison
        if: always()
        run: >-
          python3 scripts/upstream_execution.py merge
          --input-dir target/upstream-shards --shard-count 4
          --source-commit "${{ github.sha }}" --profile release
          --rustflags=-Awarnings --timeout 1800 --report target/upstream-union
          --runtime-profile graphics --package-policy native
      - name: Upload complete or incomplete union result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-r-exact-union
          path: target/upstream-union
          if-no-files-found: error

  wasm:
    name: Rust WASM execution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned Wasm unwind toolchain
        run: rustup toolchain install nightly-2026-08-25 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: WASM toolchain check
        run: bash scripts/wasm_toolchain_check.sh
      - name: Execute Rust interpreter in Node
        run: bash scripts/wasm_m3_smoke.sh
      - name: Build optional WebGPU API with R unwind support
        env:
          RPORT_WASM_FEATURES: vello-gpu
        run: bash scripts/build_wasm_runtime.sh --target web --out-dir /tmp/rport-gpu-pkg

  web-release:
    name: Browser release bundles
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RPORT_WASM_PKG: ${{ github.workspace }}/apps/workbench/webApp/build/generated/rustRuntimeResources/rust-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: gradle/actions/setup-gradle@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned Wasm unwind toolchain
        run: rustup toolchain install nightly-2026-08-25 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Install pinned Yarn classic
        run: npm install --global yarn@1.22.22

      - name: Build and budget the production bundle
        working-directory: apps/workbench
        env:
          RPORT_WASM_PROFILE_NAMES: ${{ runner.temp }}/showcase-evidence/runtime-profile.wasm
        run: ./gradlew --no-daemon :webApp:checkWasmProductionBundleSize

      - name: Verify original portable package contracts in production Wasm
        run: |
          mkdir -p "$RUNNER_TEMP/showcase-evidence"
          node tests/browser/portable-package-contracts.mjs "$RPORT_WASM_PKG" | tee "$RUNNER_TEMP/showcase-evidence/portable-package-contracts.log"

      - name: Install browser test dependencies
        run: |
          npm ci --prefix tests/browser
          npm exec --prefix tests/browser -- playwright install --with-deps chromium
      - name: Exercise the Rust runtime through the browser workbench
        run: node tests/browser/rust-runtime.cjs

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install showcase dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile
      - name: Typecheck the showcase
        shell: bash
        working-directory: website
        run: |
          mkdir -p "$RUNNER_TEMP/showcase-evidence"
          python3 ../scripts/run_parity_case.py --timeout 120 --timeout-marker "$RUNNER_TEMP/showcase-evidence/typecheck.timeout" --combined-log "$RUNNER_TEMP/showcase-evidence/typecheck.log" -- pnpm typecheck
      - name: Lint the showcase
        shell: bash
        working-directory: website
        run: |
          python3 ../scripts/run_parity_case.py --timeout 120 --timeout-marker "$RUNNER_TEMP/showcase-evidence/lint.timeout" --combined-log "$RUNNER_TEMP/showcase-evidence/lint.log" -- pnpm lint
      - name: Test showcase units
        shell: bash
        working-directory: website
        run: |
          python3 ../scripts/run_parity_case.py --timeout 180 --timeout-marker "$RUNNER_TEMP/showcase-evidence/unit.timeout" --combined-log "$RUNNER_TEMP/showcase-evidence/unit.log" -- pnpm test:unit
      - name: Build the showcase
        shell: bash
        working-directory: website
        run: |
          python3 ../scripts/run_parity_case.py --timeout 300 --timeout-marker "$RUNNER_TEMP/showcase-evidence/build.timeout" --combined-log "$RUNNER_TEMP/showcase-evidence/build.log" -- pnpm build
      - name: Install showcase Chromium
        shell: bash
        working-directory: website
        run: |
          python3 ../scripts/run_parity_case.py --timeout 180 --timeout-marker "$RUNNER_TEMP/showcase-evidence/browser-install.timeout" --combined-log "$RUNNER_TEMP/showcase-evidence/browser-install.log" -- pnpm exec playwright install --with-deps chromium
      - name: Exercise the showcase through Chromium
        shell: bash
        working-directory: website
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/showcase-evidence/playwright.json
        run: |
          # Bound the complete serial suite; individual R requests keep 15s.
          python3 ../scripts/run_parity_case.py --timeout 1200 --timeout-marker "$RUNNER_TEMP/showcase-evidence/browser.timeout" --combined-log "$RUNNER_TEMP/showcase-evidence/browser.log" -- pnpm test:e2e --reporter=line,json
      - name: Profile unchanged cold and warm Wasm workflows
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/showcase-evidence/runtime-profile.wasm" && -f "$RPORT_WASM_PKG/rust-runtime-optimization.json" ]]; then
            node tests/browser/wasm-workflow-profile.mjs "$RPORT_WASM_PKG" "$RUNNER_TEMP/showcase-evidence/cpu-profiles" "$RUNNER_TEMP/showcase-evidence/runtime-profile.wasm" | tee "$RUNNER_TEMP/showcase-evidence/workflow-profile.jsonl"
          else
            echo '{"state":"unavailable","reason":"production profile module was not built"}' > "$RUNNER_TEMP/showcase-evidence/workflow-profile.jsonl"
          fi
      - name: Preserve showcase command and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-validation
          path: |
            ${{ runner.temp }}/showcase-evidence
            website/test-results
          if-no-files-found: warn
      - name: Upload static showcase
        uses: actions/upload-artifact@v4
        with:
          name: rove-website
          path: website/dist
