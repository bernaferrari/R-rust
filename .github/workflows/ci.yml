name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Clippy (workspace, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test rmath
        run: env RUSTFLAGS="-Awarnings" cargo test -p rmath -- --test-threads=1

      - name: Test embedding APIs
        run: env RUSTFLAGS="-Awarnings" cargo test -p r-embed -p r-uniffi -- --test-threads=1

      - name: Set up R
        if: runner.os == 'Linux'
        uses: r-lib/actions/setup-r@v2

      - name: Script-level differential tests
        if: runner.os == 'Linux'
        run: bash scripts/script_diff_parity.sh --check

      # Goldens (normal and error cases) are reviewed artifacts: CI only
      # checks parity. When a golden legitimately changes, regenerate locally
      # with `bash scripts/conformance_parity.sh --regen-goldens` and commit
      # the reviewed diff; never auto-regenerate in CI.
      - name: Stock R conformance (strict)
        if: runner.os == 'Linux'
        run: bash scripts/conformance_parity.sh --check --strict

      - name: Upstream core slices (strict)
        if: runner.os == 'Linux'
        run: bash scripts/upstream_core_slices.sh --report "${RUNNER_TEMP}/upstream-core-slices"

      - name: Pure-R package corpus (strict)
        if: runner.os == 'Linux'
        run: bash scripts/pure_r_package_corpus.sh --check

      - name: Safe API audit
        run: bash scripts/audit_safe_api.sh

  miri:
    name: Miri (memory safety)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: miri-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            miri-cargo-

      - name: Miri smoke tests
        run: |
          cargo miri test -p rmath \
            sexp::memory::tests::test_arena_alloc_node \
            sexp::gengc::tests::test_full_gc_preserves_protected_old_objects \
            -- --test-threads=1

  wasm:
    name: WASM toolchain (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            wasm-cargo-

      - name: WASM toolchain check
        run: bash scripts/wasm_toolchain_check.sh
