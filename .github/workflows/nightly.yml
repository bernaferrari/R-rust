name: Nightly

on:
  schedule:
    # 03:17 UTC daily; off-the-hour to avoid the GitHub Actions cron rush.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  miri:
    name: Miri (sexp safe layer)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2

      - name: Miri on the sexp safe-layer test subset
        run: "cargo +nightly miri test -p rmath sexp::"

  gc-torture:
    name: GC torture stress
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: GC torture stress differential
        run: bash scripts/gc_torture_stress.sh
