name: Nightly

on:
  schedule:
    # 03:17 UTC daily; off-the-hour to avoid the GitHub Actions cron rush.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  miri:
    name: Miri (sexp safe layer)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2

      - name: Miri on the sexp safe-layer test subset
        env:
          # The runtime deliberately allocates immortal persistent objects
          # (base symbols, CHARSXP payloads, primitive metadata) that live
          # until process exit, mirroring upstream R, so Miri's leak check is
          # disabled. Stacked Borrows checking — the point of this job — is
          # unaffected.
          MIRIFLAGS: -Zmiri-ignore-leaks -Zmiri-strict-provenance
        run: "cargo +nightly miri test -p rmath --lib sexp::object::"

  miri-memory-allocations:
    name: Miri (allocation admission and transient ownership)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Reject invalid layouts and retain transient owner accounting
        env:
          MIRIFLAGS: -Zmiri-ignore-leaks -Zmiri-strict-provenance
        run: |
          cargo +nightly miri test -p rmath --lib transient_alloc
          cargo +nightly miri test -p rmath --lib vector_allocation_
          cargo +nightly miri test -p rmath --lib vector_compatibility_constructor
          cargo +nightly miri test -p rmath --lib graphapp_memory_
          cargo +nightly miri test -p rmath --lib graphapp_image_
          cargo +nightly miri test -p rmath --lib decimal_separator_is_terminated_for_real_encoding
          cargo +nightly miri test -p rmath --lib --target i686-unknown-linux-gnu vector_allocation_
          cargo +nightly miri test -p rmath --lib --target i686-unknown-linux-gnu graphapp_memory_

  miri-compact-vectors:
    name: Miri (compact vector expansion and recovery)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Retain lazy values and their original memory owner
        env:
          MIRIFLAGS: -Zmiri-ignore-leaks -Zmiri-strict-provenance
        run: |
          cargo +nightly miri test -p rmath --lib sexp::altseq::tests
          cargo +nightly miri test -p rmath --lib --target i686-unknown-linux-gnu sexp::altseq::tests

  miri-altrep-classes:
    name: Miri (Rust ALTREP classes and shared GC buffers)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Check rooted Rust classes and translated readers
        env:
          MIRIFLAGS: -Zmiri-ignore-leaks -Zmiri-strict-provenance
        run: |
          cargo check -p rmath --all-targets
          cargo test -p rmath --lib sexp::altrep::
          cargo +nightly miri test -p rmath --lib sexp::altrep::
          cargo +nightly miri test -p rmath --lib altrep_borrowed_string_is_retained_by_parent
          cargo +nightly miri test -p rmath --lib sexp::altseq::tests
          cargo +nightly miri test -p rmath --lib --target i686-unknown-linux-gnu sexp::altrep::
          cargo +nightly miri test -p rmath --lib sexp::altrep::storage::safety_tests
          cargo +nightly miri test -p rmath --lib class_duplicates_copy_public_attributes
          cargo +nightly miri test -p rmath --lib sexp::gengc::notification_tests
          cargo +nightly miri test -p rmath --lib sexp::session::gc_owner_teardown_tests

  miri-owned-evaluation:
    name: Miri (owning ${{ matrix.subject }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - subject: arguments
            filter: owned_argument_tests
          - subject: conditions
            filter: bounded_condition_text_survives_each_allocation_and_reentrant_gc
          - subject: option defaults
            filter: options_initialization_retains_defaults_through_reentrant_gc
          - subject: option retry
            filter: options_initialization_can_retry_after_callback_unwind
          - subject: scoped source evaluation
            filter: methods_source_guard_prevents_recompilation_at_actual_closure_entry
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Retain values through collecting callbacks and errors
        env:
          MIRIFLAGS: -Zmiri-ignore-leaks -Zmiri-strict-provenance
        run: >-
          cargo +nightly miri test -p rmath --lib -- --test-threads=1
          ${{ matrix.filter }}

  miri-checked-graph:
    name: Miri (checked ${{ matrix.subject }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - subject: graph identities
            filters: >-
              cookies_exhaust_without_wrapping_or_issuing_reserved_zero
              link_identity_rejects_recreated_page_ordinal_and_generation_reuse
              canonical_scalar_and_attribute_links_never_refresh_reused_child_addresses
              canonical_singleton_links_keep_two_original_banks_distinct_after_tls_close
              nonowning_cyclic_links_release_physical_storage_with_the_last_root
              reference_vector_budget_charges_actual_link_cells_and_releases_them
          - subject: graph rewrites
            filters: >-
              canonical_saved_link_rejects_same_address_reuse_without_marking_replacement
              copied_canonical_edges_keep_the_original_generation_after_slot_reuse
              copied_child_rewrites_reject_foreign_links_before_any_field_is_published
              graph_rewrite_distinguishes_recycled_allocation_generations
              copied_child_visitors_preserve_reentrant_header_updates
              parent_shape_changes_reject_all_rewrites_and_preserve_callback_state
              selected_scalar_conflict_rejects_earlier_pending_rewrite
              selected_reference_conflict_rejects_pending_attribute_rewrite
              sparse_reference_rewrites_preserve_unselected_cells_flags_and_scalar_edges
              reference_lease_retains_original_cells_and_distinguishes_equal_capacity_allocations
          - subject: external pointer copies
            filters: >-
              deep_external_pointer_duplicate_roots_result_through_collecting_providers
              shallow_external_pointer_duplicate_roots_shared_children_through_reentrant_gc
              external_pointer_duplicates_share_native_resource_before_callbacks
          - subject: native resource lifetimes
            filters: >-
              canonical_resources_reject_foreign_types_and_retired_generations
              retired_resources_reenter_only_after_normal_or_unwinding_arena_lends
              permanent_resource_removal_defers_release_and_preserves_typed_borrowers
              canonical_resource_lives_until_final_physical_page_owner_drops
              standalone_arena_teardown_releases_detached_resources_once
              resource_cleanup_uses_exact_identity_after_type_or_body_mutation
              collected_node_resources_reenter_only_after_collection_and_arena_lends_end
          - subject: native numerical state
            filters: library::stats::starma_api::tests
          - subject: compact vector publication
            filters: >-
              checked_classification_and_materialization_respect_existing_arena_lends
              compact_sequence_automatic_roots_precede_post_lend_compatibility_guards
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Reject stale identities and overlapping owner loans
        env:
          MIRIFLAGS: -Zmiri-ignore-leaks -Zmiri-strict-provenance
        run: >-
          cargo +nightly miri test -p rmath --lib -- --test-threads=1
          ${{ matrix.filters }}

  miri-modules:
    name: Miri (session-constructing modules)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - filter: "serialize::"
            isolation: ""
          - filter: "connections::"
            isolation: ""
          # tzone's wall-clock default resolves /etc/localtime via
          # readlink — an fs syscall Miri only allows with isolation
          # disabled. Environment limitation, not aliasing.
          - filter: "tzone::"
            isolation: "-Zmiri-disable-isolation"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2

      - name: Miri on ${{ matrix.filter }} (P1/P2 aliasing discipline)
        env:
          MIRIFLAGS: -Zmiri-ignore-leaks ${{ matrix.isolation }}
        run: 'cargo +nightly miri test -p rmath --lib "${{ matrix.filter }}"'

  miri-collector:
    name: Miri (protected vectors through real GC)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Exercise slab reuse, roots and repeated collections
        env:
          # The fixture uses real session storage without evaluating the R
          # library. Full runtime bootstrap is covered by native stress tests.
          MIRIFLAGS: -Zmiri-ignore-leaks -Zmiri-strict-provenance
        run: cargo +nightly miri test -p rmath --lib gc_stress_protected_vectors_retain_data_across_collections

  miri-gc-torture:
    name: Miri (GC-torture x serialize reentrancy)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2

      - name: Miri on the tortured serialize round-trip
        env:
          # gctorture(TRUE) forces a full mark/sweep per allocation: the
          # serialize callbacks run inside with_arena lends, so this job is
          # the standing evidence for the P1 reentrancy discipline.
          MIRIFLAGS: -Zmiri-ignore-leaks -Zmiri-disable-isolation
        run: "cargo +nightly miri test -p rmath --test serialize_torture"

  miri-graphics-recording:
    name: Miri (graphics recording and backend lifetimes)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Check owned recording, GC and device restoration
        env:
          MIRIFLAGS: -Zmiri-ignore-leaks -Zmiri-disable-isolation
        run: cargo +nightly miri test -p rmath --features renderplot-device --test graphics_recording_torture

  gc-torture:
    name: GC torture stress (exact R oracle)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Validate immutable R oracle manifest
        id: oracle
        run: python3 scripts/validate_r_oracle.py --github-output "$GITHUB_OUTPUT"

      - name: Cache exact R oracle build
        uses: actions/cache@v4
        with:
          path: ${{ steps.oracle.outputs.cache_dir }}
          key: ${{ runner.os }}-r-oracle-${{ steps.oracle.outputs.manifest_sha256 }}

      - name: Install exact R oracle build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libbz2-dev libcurl4-openssl-dev libicu-dev liblzma-dev libpcre2-dev libreadline-dev libzstd-dev

      - name: Build or restore exact R oracle
        run: |
          bash scripts/install_r_oracle.sh
          echo "${{ steps.oracle.outputs.cache_dir }}/bin" >> "$GITHUB_PATH"

      - name: GC torture stress differential
        env:
          RPORT_REQUIRE_PINNED_ORACLE: "1"
        run: bash scripts/gc_torture_stress.sh

  oracle-drift:
    name: Informational R ${{ matrix.r-version }} drift
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        r-version: [release, devel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}

      - name: Compare moving channel (informational only)
        run: bash scripts/conformance_parity.sh --check --strict
