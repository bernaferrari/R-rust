name: Parity Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Format + focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        shell: bash
        run: cargo fmt --check --all

      - name: Test rmath
        shell: bash
        run: env RUSTFLAGS="-Awarnings" cargo test -p rmath -- --test-threads=1

      - name: Test embedding APIs
        shell: bash
        run: env RUSTFLAGS="-Awarnings" cargo test -p r-embed -p r-uniffi -- --test-threads=1

  desktop-host-smoke:
    name: Desktop host smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Desktop host smoke
        shell: bash
        run: scripts/desktop_host_smoke.sh

  android-baseline:
    name: Android baseline + tooling
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Android toolchain check
        shell: bash
        run: scripts/android_toolchain_check.sh

      - name: Android package smoke
        shell: bash
        run: scripts/android_package_smoke.sh --check

  uniffi-bindings:
    name: UniFFI binding check
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Generate bindings
        shell: bash
        run: scripts/generate_uniffi_bindings.sh --check

  conformance:
    name: Conformance harness
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Build rmath artifact
        shell: bash
        run: env RUSTFLAGS="-Awarnings" cargo build -p rmath

      # Error goldens are reviewed artifacts: CI only checks parity.
      # Regenerate locally with
      # `bash scripts/conformance_parity.sh --regen-goldens` and commit the
      # reviewed diff; never auto-regenerate in CI.
      - name: Run conformance harness
        shell: bash
        run: scripts/conformance_parity.sh --check

  script-diff:
    name: Script-level differential (Rscript vs rport)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Run script-diff harness
        shell: bash
        run: bash scripts/script_diff_parity.sh --check
