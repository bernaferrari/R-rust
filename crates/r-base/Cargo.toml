[package]
name = "r-base"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "The primitive registry: base, stats, and graphics builtins over the r-core substrate (staging crate of the rmath monolith split — domain separation into r-stats/r-graphics follows)"

[lib]
crate-type = ["rlib"]
name = "r_base"

[dependencies]
r-core = { path = "../r-core" }
r-math = { path = "../r-math" }
r-graphics-engine = { path = "../r-graphics-engine" }
web-time = "1"
libm = { version = "0.2.16", default-features = false, features = ["force-soft-floats"] }
num = "0.4"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
bzip2 = "0.6"
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "xz", "encoder"] }
md-5 = "0.11"
sha2 = "0.11"
getrandom = { version = "0.4", features = ["wasm_js"] }
fancy-regex = "0.19"
hashbrown.workspace = true
