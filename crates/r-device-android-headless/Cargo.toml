[package]
name = "r-device-android-headless"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
description = "Pure Rust headless graphics backend (Vello CPU) for Android, WASM, servers and other no-display targets"

[dependencies]
vello_cpu = { version = "0.2.0", default-features = false, features = ["std", "text", "u8_pipeline"] }
png = "0.18.1"
fontdue = "0.9"

r-graphics-engine = { path = "../r-graphics-engine" }

[target.'cfg(target_os = "android")'.dependencies]
log = "0.4"

[features]
default = []
