[package]
name = "r-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wasm-bindgen session boundary over r-embed::RSession for browser and Node hosts"

[lib]
# cdylib for wasm-pack; rlib so `cargo check -p r-wasm` also works natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
r-embed = { path = "../r-embed", default-features = false, features = ["rust-backend"] }

# wasm-bindgen is only linked on wasm32; native `cargo check -p r-wasm`
# exercises the same session code through the cfg'd non-bindgen shim.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
