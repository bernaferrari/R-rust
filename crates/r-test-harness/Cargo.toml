[package]
name = "r-test-harness"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
diff = "0.1"
console = "0.15"
clap = { version = "4.5", features = ["derive"] }

[dependencies.r-embed]
path = "../r-embed"
