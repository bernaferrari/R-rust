[workspace]
resolver = "2"
members = [
  "crates/r-device-android-headless",
  "crates/r-embed",
  "crates/r-graphics-engine",
  "crates/r-host-cli",
  "crates/r-uniffi",
  "rmath-rs/nmath",
  "rmath-rs/rmath",
  "rmath-rs/rmath-test",
  "tests/script-diff",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Project contributors"]
license = "GPL-2.0-or-later"
repository = "https://github.com/bernaferrari/R-rust"
homepage = "https://github.com/bernaferrari/R-rust"

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
hashbrown = "0.17"
smallvec = "1.15"
libc = "0.2"
jni = "0.22"
