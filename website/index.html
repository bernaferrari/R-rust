<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f6ef" />
    <script>
      ;(() => {
        let preference = null
        try {
          preference = localStorage.getItem("rove-theme")
        } catch {}
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
        document.documentElement.style.colorScheme = dark ? "dark" : "light"
        document.querySelector('meta[name="theme-color"]').content = dark
          ? "#171e1c"
          : "#f8f6ef"
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Real R, right in your browser. Explore runnable examples, make beautiful plots, and give local AI a statistical superpower with Rove's Rust and WebAssembly runtime."
    />
    <meta property="og:title" content="Rove — R belongs everywhere." />
    <meta
      property="og:description"
      content="A playful R playground. Local computation, beautiful graphics, and an AI that lets R do the math."
    />
    <meta property="og:type" content="website" />
    <title>Rove — R belongs everywhere.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
