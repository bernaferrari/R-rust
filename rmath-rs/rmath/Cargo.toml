[package]
name = "rmath"
version = "0.1.0"
edition = "2024"
description = "Rust port of R's nmath statistical library"

[lib]
crate-type = ["rlib", "staticlib"]
name = "rmath"

[features]
default = ["rust-backend"]
# Use Fortran LAPACK/BLAS via FFI (requires Fortran toolchain, not suitable for Android)
fortran-backend = []
# Use pure Rust linear algebra via faer-rs (Android-compatible, no external toolchain)
rust-backend = ["faer"]

[dependencies]
libm = "0.1"
num = "0.4"
libc = "0.2"
hashbrown.workspace = true
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
bzip2 = "0.6"
lzma-rs = "0.3"

# Pure Rust linear algebra backend (enabled via rust-backend feature)
faer = { version = "0.24", optional = true }

[[bench]]
name = "bench_eval"
