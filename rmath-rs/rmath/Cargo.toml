[package]
name = "rmath"
version = "0.1.0"
edition = "2024"
description = "Rust port of R's nmath statistical library"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]
name = "rmath"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
uniffi = { version = "0.28", features = ["cli"] }

[features]
default = ["rust-backend"]
# Use Fortran LAPACK/BLAS via FFI (requires Fortran toolchain, not suitable for Android)
fortran-backend = []
# Use pure Rust linear algebra via faer-rs (Android-compatible, no external toolchain)
rust-backend = ["faer"]
# Enable RenderPlot-backed GE device for high-quality skia output inside real R graphics (plot, grid, etc.)
# Pulls r-graphics-engine (kept optional so pure-math WASM builds stay small).
renderplot-device = ["r-graphics-engine"]

[dependencies]
libm = "0.1"
num = "0.4"
libc = "0.2"
hashbrown.workspace = true
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
bzip2 = "0.6"
lzma-rs = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }

# Pure Rust linear algebra backend (enabled via rust-backend feature).
# Keep default features off so wasm builds do not pull faer's rayon/spindle
# parallel backend, which depends on native-style atomic waits.
faer = { version = "0.24", default-features = false, features = ["std", "linalg"], optional = true }

r-graphics-engine = { path = "../../crates/r-graphics-engine", optional = true }

uniffi = { version = "0.28" }

[[bench]]
name = "bench_eval"
harness = false
